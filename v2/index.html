<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E1B35"><meta name="description" content="INITIUM ONE LAB · Tu campus de dirección y marketing estratégico.">
<title>INITIUM ONE LAB · Campus</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="campus-shell" id="campus">
  <aside class="sidebar" id="sidebar">
    <div class="brand-lockup">
      <img src="./assets/nat-logo-vertical.svg" alt="Nat Moreno & Co." width="156" height="145">
      <div class="brand-divider"></div>
      <div class="product-mark">INITIUM <span>ONE LAB</span></div>
      <small>INITIUM ACADEMY</small>
    </div>
    <nav class="side-nav" aria-label="Secciones del campus" id="side-nav"></nav>
    <div class="sidebar-bottom">
      <div class="course-poster"><img src="./assets/mountain-scene.svg" alt="Paisaje editorial del programa INITIUM"><div class="poster-overlay"><span>INITIUM</span><strong>ONE LAB</strong><small>Diagnóstico · Estrategia · Ejecución</small></div></div>
      <div class="sidebar-credit">UNA METODOLOGÍA DE<br><strong>NAT MORENO & CO.</strong></div>
    </div>
  </aside>
  <div class="shell-main">

      <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú del campus">☰</button><img class="top-logo" src="./assets/nat-logo-horizontal.svg" alt="Nat Moreno & Co." width="180" height="27"><span class="top-separator"></span><span class="campus-name">Campus <b>INITIUM ONE LAB</b></span></div>
      <div class="topbar-right"><span class="build-chip">VISTA DE DESARROLLO</span><button class="top-icon" data-action="help" aria-label="Ayuda del campus"><span aria-hidden="true">?</span></button><button class="profile" data-action="profile" aria-label="Perfil de demostración">NM</button></div>
    </header>
    <main id="view" aria-live="polite" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body></html>
